syntax = "proto3";

package syncflow;

message DiscoveryMessage {
    string device_id = 1;
    string device_name = 2;
    int32 port = 3;
}

message AuthRequest {
    string device_id = 1;
    bytes certificate = 2; // DER encoded certificate
    bytes challenge_response = 3;
}

message AuthResponse {
    bool success = 1;
    string error_message = 2;
    bytes certificate = 3;
}

message FileMetadata {
    string path = 1;
    int64 size = 2;
    string checksum = 3; // SHA-256
    int64 modified_time = 4;
    bool is_directory = 5;
}

message SyncStatusRequest {
    string folder_id = 1;
}

message SyncStatusResponse {
    string folder_id = 1;
    repeated FileMetadata files = 2;
}

message FileDataChunk {
    string file_path = 1;
    int64 offset = 2;
    bytes data = 3;
}

message SyncFlowMessage {
    oneof msg {
        DiscoveryMessage discovery = 1;
        AuthRequest auth_req = 2;
        AuthResponse auth_res = 3;
        SyncStatusRequest status_req = 4;
        SyncStatusResponse status_res = 5;
        FileDataChunk file_chunk = 6;
    }
}
